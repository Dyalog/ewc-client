name: Update Docs

# Manual trigger (Actions → "Update Docs") or invoked by release.yml.
# Regenerates the reference docs (docs/ObjectRef/*.md + the mkdocs.yml nav) by
# running EWC.Doc.Make in a Dyalog container, then opens a PR so the changes are
# reviewed before they reach the docs site. Mirrors the update-baselines
# PR flow (GITHUB_TOKEN + peter-evans/create-pull-request).

on:
  workflow_dispatch:
  workflow_call:

permissions:
  # contents: write to push the bot branch with regenerated docs.
  # pull-requests: write to open / update the PR itself.
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ewc
        uses: actions/checkout@v4
        with:
          path: ewc
          token: ${{ secrets.GITHUB_TOKEN }}

      # Sibling checkout so EWC.Doc.Make can validate doc links against it
      - name: Checkout documentation
        uses: actions/checkout@v4
        with:
          repository: Dyalog/documentation
          path: documentation
          sparse-checkout: object-reference

      - name: Regenerate docs (Dyalog, one-shot)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/ewc:/work/ewc" \
            -v "${{ github.workspace }}/documentation:/work/documentation:ro" \
            --entrypoint /work/ewc/ci/regen-docs.sh \
            dyalog/dyalog:latest
          # Container writes as root; hand the files back to the runner user
          sudo chown -R "$(id -u):$(id -g)" ewc

      - name: Open PR with regenerated docs
        # Commits only `add-paths`, creates or updates the fixed head branch,
        # and opens/updates the PR. Uses GITHUB_TOKEN — the PR it opens (and
        # its merge) don't trigger downstream workflows, so Deploy Docs won't
        # auto-fire on merge; run it from the Actions menu to publish.
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ewc
          add-paths: |
            docs/ObjectRef/**
            mkdocs.yml
          # Fixed branch name per target — re-running updates the existing PR
          branch: docs-regenerate/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          commit-message: "docs: regenerate reference documentation (run #${{ github.run_number }})"
          title: "docs: regenerate reference documentation (${{ github.ref_name }})"
          body: |
            Regenerated `docs/ObjectRef/*.md` and the `mkdocs.yml` nav via `EWC.Doc.Make` (run in a Dyalog container).

            ### Review checklist

            - [ ] Open the "Files changed" tab and confirm the reference pages look right
            - [ ] Check that added/removed properties, events and classes match intended changes

            > **To publish:** after merging, run **Deploy Docs** from the Actions menu. A GITHUB_TOKEN-authored merge doesn't auto-trigger it.

            ---
            _Generated by run #${{ github.run_number }}_
