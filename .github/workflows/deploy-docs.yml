name: Deploy Docs

on:
  # Auto-fires on a human push/merge that changes docs. After merging an
  # Update Docs PR (GITHUB_TOKEN-authored, so it may not auto-trigger), run
  # this from the Actions menu to publish.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mike needs full history + the gh-pages branch

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mkdocs + mike
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mike

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy 'latest' to gh-pages
        run: |
          mike deploy --push latest
          mike set-default --push latest
